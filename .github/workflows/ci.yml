name: CI

on:
  pull_request:
    types: ['opened', 'edited', 'reopened', 'synchronize']
    branches:
      - main
      - beta
      - alpha
      - dev
      - feat/*
      - feature/*
      - v[0-9]*

permissions:
  actions: read
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml
    secrets:
      ANKR_API_KEY: ${{ secrets.ANKR_API_KEY }}
      POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}

  linters:
    name: Linters
    uses: ./.github/workflows/linters.yml

  eslint-review:
    name: ESLint Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: reviewdog/action-eslint@6dad10dc50476699ad1ddbbb19bf55d36f311a39 # v1.37.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}