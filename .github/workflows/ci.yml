name: CI

on:
  pull_request:
    types: ['opened', 'edited', 'reopened', 'synchronize']
    branches:
      - main
      - beta
      - alpha
      - dev
      - feat/*
      - feature/*
      - v[0-9]*

permissions:
  actions: read
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml
    secrets:
      ANKR_API_KEY: ${{ secrets.ANKR_API_KEY }}
      POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}

  linters:
    name: Linters
    uses: ./.github/workflows/linters.yml

  eslint-review:
    name: ESLint Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      # Install deps without prepare (which runs a full build and OOMs on runners).
      # reviewdog falls back to `npm install` when eslint is missing; that triggers
      # prepare → build and fails after the "eslint: not found" message.
      - run: npm ci --ignore-scripts

      - uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
